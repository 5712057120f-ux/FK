<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE GAME — Desktop Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#f5f1e8;font-family:Arial,"Noto Sans Thai",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 70% 20%,#2b2110 0,transparent 32%),linear-gradient(135deg,#030303,#101010 55%,#050505)}
nav{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;border-bottom:1px solid #3b301b;background:#070707dd;backdrop-filter:blur(12px)}
.logo{font-family:Georgia,serif;font-size:30px;letter-spacing:5px;color:#e1bd68}.links{display:flex;gap:28px;color:#a99c80;font-size:13px}
.hero{min-height:calc(100vh - 76px);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:5vw;padding:7vh 7vw}
.kicker{font-size:11px;letter-spacing:5px;color:#a78543}.hero h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(52px,7vw,104px);line-height:.93;margin:18px 0;background:linear-gradient(#fff1c4,#d2a84e,#806020);-webkit-background-clip:text;color:transparent}
.hero p{max-width:620px;color:#9d978c;line-height:1.9;font-size:16px}
.actions{display:flex;gap:12px;margin-top:32px}.btn{padding:15px 28px;border-radius:10px;text-decoration:none;font-weight:700}.gold{background:linear-gradient(120deg,#76531a,#ffe29a,#8d641d);color:#151008}.dark{border:1px solid #8d6b2f;color:#dfbf70;background:#0c0c0c}
.visual{min-height:570px;border:1px solid #6e5528;border-radius:30px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#b68a362b,transparent 26%),linear-gradient(145deg,#17130c,#070707)}
.ring{position:absolute;border:1px solid #c89d484f;border-radius:50%;inset:12%}.ring.two{inset:24%;border-color:#d9b76d33}.mark{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.mark b{display:block;font-family:Georgia,serif;font-size:68px;letter-spacing:10px;color:#dbb661}.mark span{font-size:10px;letter-spacing:6px;color:#75613c}
.note{position:absolute;left:25px;bottom:23px;color:#5f594f;font-size:11px;letter-spacing:2px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.visual{min-height:420px}.links{display:none}}
</style>
</head>
<body>
<nav><div class="logo">TG</div><div class="links"><span>HOME</span><span>DISCOVER</span><span>EXPERIENCE</span><span>CONTACT</span></div></nav>
<main class="hero">
<section>
<div class="kicker">DESKTOP EXPERIENCE · DEMO</div>
<h1>PREMIUM<br>EXPERIENCE</h1>
<p>ตัวอย่างหน้า Desktop สำหรับทดสอบการแยกหน้าเว็บตามขนาดหน้าจอ โดยยังอยู่ภายใต้โปรเจกต์เดียวกันบน Netlify</p>
<div class="actions"><a class="btn gold" href="/mobile/">ดูหน้า Mobile</a><a class="btn dark" href="/">ทดสอบอีกครั้ง</a></div>
</section>
<section class="visual"><div class="ring"></div><div class="ring two"></div><div class="mark"><div><b>TG</b><span>DESKTOP EDITION</span></div></div><div class="note">THE GAME · DEVICE ROUTING TEST</div></section>
</main>
</body>
</html>
