<script>

(function(){

  const online =
    document.getElementById("tgOnline");

  if(!online) return;

  let current = 35284;


  function updateOnline(){

    const change =
      Math.floor(
        Math.random() * 9
      ) - 4;

    current += change;


    if(current < 35150){

      current = 35150;

    }


    if(current > 35450){

      current = 35450;

    }


    online.textContent =
      current.toLocaleString("en-US");

  }


  setInterval(
    updateOnline,
    4500
  );

})();

</script>
